<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2429">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recouvrement">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Recouvrement</title>
<style>
:root{--bg:#f3f2ee;--card:#fff;--tx:#1f2429;--mu:#6b7176;--bd:#e0ded6;--ink:#1f2429;--ye:#f5b800;--ko:#b42318;--ok:#2f7d4f}
@media(prefers-color-scheme:dark){:root{--bg:#15181b;--card:#1f2429;--tx:#f1efe8;--mu:#979ca1;--bd:#31373d;--ink:#f1efe8;--ko:#f08a7e;--ok:#6fcf97}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
main{max-width:640px;margin:auto;padding:0 16px 24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mu{color:var(--mu);font-size:14px}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.big{font-size:26px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 13px;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 13px;font-size:14px}
.btn.pri{background:var(--ye);border-color:var(--ye);color:#1f2429;font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--bd);margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ye)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));box-shadow:0 4px 14px rgba(0,0,0,.25);padding:13px 18px;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:15px 0 12px;color:var(--mu);font-size:15px;border-top:3px solid transparent;margin-top:-1px}
nav .on{color:var(--tx);font-weight:700;border-top-color:var(--ye)}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,400px);background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 6px}
label{display:block;margin:12px 0 0;font-size:14px;color:var(--mu)}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-top:4px}
.list .row{padding:9px 0;border-top:1px solid var(--bd)}
.x{border:0;background:none;color:var(--mu);font-size:20px;padding:0 6px}
.vide{text-align:center;padding:36px 12px;color:var(--mu)}
:focus-visible{outline:3px solid var(--ye);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,setDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyC7Ngt39G9NqHsZhq6l6zzNxmQM43d7i-4",
  authDomain:"recouvrement-f2348.firebaseapp.com",
  projectId:"recouvrement-f2348",
  storageBucket:"recouvrement-f2348.firebasestorage.app",
  messagingSenderId:"571112131653",
  appId:"1:571112131653:web:f3738babea31880cb4272c"
});
const auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('fr-FR').format(Math.round(n||0))+' FCFA';
const today=()=>new Date().toISOString().slice(0,10);
const sum=a=>a.reduce((t,x)=>t+x.montant,0);
const S={user:null,creances:[],paiements:[],depenses:[],tab:'c',types:new Set(),statut:'cours',jour:today()};
const colRef=n=>collection(db,'users',S.user.uid,n);
const save=(n,data,id)=>setDoc(id?doc(db,'users',S.user.uid,n,id):doc(colRef(n)),data).catch(console.error);
const del=(n,id)=>deleteDoc(doc(db,'users',S.user.uid,n,id)).catch(console.error);
const paye=id=>sum(S.paiements.filter(p=>p.creanceId===id));

function form(title,fields,ok){
  const d=document.createElement('dialog');
  d.innerHTML=`<form method="dialog"><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.o
    ?`<select name="${f.n}">${f.o.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select>`
    :`<input name="${f.n}" type="${f.t||'text'}" value="${f.v??''}" ${f.r===0?'':'required'} ${f.t==='number'?'inputmode="decimal" step="any" min="0"':''}>`}</label>`).join('')}
    <div class="row" style="margin-top:18px"><button class="btn" value="x" formnovalidate>Annuler</button><button class="btn pri" value="ok">Enregistrer</button></div></form>`;
  d.onclose=()=>{if(d.returnValue==='ok')ok(Object.fromEntries(new FormData(d.querySelector('form'))));d.remove()};
  document.body.append(d);d.showModal();
}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}

const act={
  tab:(_,v)=>{S.tab=v;render()},
  type:(_,v)=>{S.types.has(v)?S.types.delete(v):S.types.add(v);render()},
  statut:(_,v)=>{S.statut=v;render()},
  nc:()=>form('Nouvelle créance',[
    {l:'Client',n:'client'},{l:'Référence (voyage, plaque…)',n:'ref',r:0},
    {l:'Type',n:'type',o:[['remorque','Remorque'],['camion','Camion 16 roues']]},
    {l:'Montant total (FCFA)',n:'total',t:'number'},{l:'Avance reçue (FCFA)',n:'avance',t:'number',v:0,r:0},
    {l:'Date',n:'date',t:'date',v:today()}],v=>{
      const r=doc(colRef('creances'));
      setDoc(r,{client:v.client.trim(),ref:v.ref.trim(),type:v.type,total:+v.total,date:v.date}).catch(console.error);
      if(+v.avance>0)save('paiements',{creanceId:r.id,montant:+v.avance,date:v.date});
    }),
  pay:id=>form('Nouveau paiement',[{l:'Montant reçu (FCFA)',n:'m',t:'number'},{l:'Date',n:'date',t:'date',v:today()}],
    v=>save('paiements',{creanceId:id,montant:+v.m,date:v.date})),
  dc:()=>form('Nouvelle dépense',[{l:'Libellé',n:'libelle'},{l:'Montant (FCFA)',n:'m',t:'number'},{l:'Date',n:'date',t:'date',v:S.jour}],
    v=>save('depenses',{libelle:v.libelle.trim(),montant:+v.m,date:v.date})),
  del:(id,n)=>{if(!confirm('Supprimer définitivement ?'))return;
    if(n==='creances')S.paiements.filter(p=>p.creanceId===id).forEach(p=>del('paiements',p.id));
    del(n,id)},
  recu:id=>{
    const c=S.creances.find(x=>x.id===id);
    const p=S.paiements.filter(x=>x.creanceId===id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(!p)return alert('Aucun paiement enregistré pour cette créance.');
    const w=open('','_blank');
    w.document.write(`<title>Reçu</title><body style="font:17px system-ui;max-width:420px;margin:32px auto;padding:0 16px"><h2>Reçu de paiement</h2><p>Date : ${p.date}</p><p>Client : ${esc(c.client)} ${esc(c.ref)}</p><p><b>Montant reçu : ${fmt(p.montant)}</b></p><p>Reste dû : ${fmt(c.total-paye(id))}</p><script>print()<\/script>`);
    w.document.close();
  },
  csv:()=>{
    const L=[['Client','Référence','Type','Date','Total','Payé','Reste']];
    S.creances.forEach(c=>{const p=paye(c.id);L.push([c.client,c.ref,c.type,c.date,c.total,p,c.total-p])});
    dl('creances-'+today()+'.csv','\ufeff'+L.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv');
  },
  backup:()=>dl('recouvrement-sauvegarde-'+today()+'.json',JSON.stringify({creances:S.creances,paiements:S.paiements,depenses:S.depenses}),'application/json'),
  rest:()=>$('#rf').click(),
  out:()=>signOut(auth)
};

function vueC(){
  const L=S.creances.map(c=>({...c,paye:paye(c.id)})).map(c=>({...c,reste:c.total-c.paye}));
  const du=L.reduce((t,c)=>t+Math.max(0,c.reste),0);
  const V=L.filter(c=>(!S.types.size||S.types.has(c.type))&&(S.statut==='tous'||(S.statut==='cours')===(c.reste>0)))
    .sort((a,b)=>b.date.localeCompare(a.date));
  const chip=(a,v,t,on)=>`<button class="chip ${on?'on':''}" data-a="${a}" data-v="${v}">${t}</button>`;
  return `<div class="card"><div class="mu">Reste à recouvrer</div><div class="num big" style="color:var(--ko)">${fmt(du)}</div></div>
  <div class="chips">${chip('type','remorque','Remorques',S.types.has('remorque'))}${chip('type','camion','Camions 16 roues',S.types.has('camion'))}
  ${chip('statut','cours','En cours',S.statut==='cours')}${chip('statut','soldees','Soldées',S.statut==='soldees')}${chip('statut','tous','Toutes',S.statut==='tous')}</div>
  ${V.length?V.map(c=>`<div class="card"><div class="row"><b>${esc(c.client)}</b><span class="mu">${c.type==='camion'?'Camion':'Remorque'}, ${c.date}</span></div>
  ${c.ref?`<div class="mu">${esc(c.ref)}</div>`:''}
  <div class="bar"><i style="width:${Math.min(100,c.paye/(c.total||1)*100)}%"></i></div>
  <div class="row"><span class="mu">Payé ${fmt(c.paye)} sur ${fmt(c.total)}</span><span class="num" style="font-size:19px;color:var(${c.reste>0?'--ko':'--ok'})">${c.reste>0?fmt(c.reste):'Soldée'}</span></div>
  <div class="acts">${c.reste>0?`<button class="btn pri" data-a="pay" data-id="${c.id}">Ajouter un paiement</button>`:''}
  <button class="btn" data-a="recu" data-id="${c.id}">Reçu PDF</button><button class="btn" data-a="del" data-id="${c.id}" data-v="creances">Supprimer</button></div></div>`).join('')
  :`<div class="vide">Aucune créance ici.<br>Touchez « Nouvelle créance » pour en ajouter une.</div>`}
  <button class="btn pri fab" data-a="nc">Nouvelle créance</button>`;
}
function vueK(){
  const P=S.paiements.filter(p=>p.date===S.jour),D=S.depenses.filter(x=>x.date===S.jour),e=sum(P),s=sum(D);
  const nom=p=>esc(S.creances.find(c=>c.id===p.creanceId)?.client||'Client supprimé');
  return `<label style="margin:0 0 12px">Jour<input type="date" value="${S.jour}" data-a="jour"></label>
  <div class="card"><div class="row"><span class="mu">Encaissé</span><span class="num">${fmt(e)}</span></div>
  <div class="row"><span class="mu">Dépenses</span><span class="num">− ${fmt(s)}</span></div>
  <div class="row" style="border-top:1px solid var(--bd);margin-top:8px;padding-top:10px"><span>Reste en caisse</span><span class="num big" style="color:var(${e-s<0?'--ko':'--ok'})">${fmt(e-s)}</span></div></div>
  <div class="card list"><b>Encaissements</b>${P.length?P.map(p=>`<div class="row"><span>${nom(p)}</span><span class="num">${fmt(p.montant)} <button class="x" data-a="del" data-id="${p.id}" data-v="paiements" aria-label="Supprimer">×</button></span></div>`).join(''):'<div class="mu">Aucun encaissement ce jour.</div>'}</div>
  <div class="card list"><b>Dépenses</b>${D.length?D.map(x=>`<div class="row"><span>${esc(x.libelle)}</span><span class="num">${fmt(x.montant)} <button class="x" data-a="del" data-id="${x.id}" data-v="depenses" aria-label="Supprimer">×</button></span></div>`).join(''):'<div class="mu">Aucune dépense ce jour.</div>'}</div>
  <button class="btn pri fab" data-a="dc">Nouvelle dépense</button>`;
}
function vueP(){
  return `<div class="card"><div class="mu">Connecté : ${esc(S.user.email)}<br>Les données sont gardées sur l'appareil et se synchronisent dès que le réseau revient.</div></div>
  <div class="acts" style="flex-direction:column"><button class="btn" data-a="csv">Exporter les créances (CSV)</button><button class="btn" data-a="backup">Sauvegarde complète (JSON)</button>
  <button class="btn" data-a="rest">Restaurer une sauvegarde</button><button class="btn" data-a="out">Se déconnecter</button></div>
  <input type="file" id="rf" accept=".json" hidden>`;
}
function render(){
  const A=$('#app');
  if(!S.user){
    A.innerHTML=`<main><div class="card" style="margin-top:18vh"><h1>Recouvrement</h1><form id="lg"><label>E-mail<input name="e" type="email" required autocomplete="username"></label>
    <label>Mot de passe<input name="p" type="password" required autocomplete="current-password"></label><p id="er" class="mu"></p><button class="btn pri" style="width:100%">Se connecter</button></form></div></main>`;
    $('#lg').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
      try{await signInWithEmailAndPassword(auth,f.get('e'),f.get('p'))}catch{$('#er').textContent='E-mail ou mot de passe incorrect, ou pas de réseau.'}};
    return;
  }
  const t=S.tab;
  A.innerHTML=`<header><h1>${{c:'Créances',k:'Caisse',p:'Réglages'}[t]}</h1><span class="mu">${navigator.onLine?'En ligne':'Hors ligne'}</span></header>
  <main>${t==='c'?vueC():t==='k'?vueK():vueP()}</main>
  <nav>${[['c','Créances'],['k','Caisse'],['p','Réglages']].map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${t===k?'on':''}">${l}</button>`).join('')}</nav>`;
}
$('#app').onclick=e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset.id,b.dataset.v)};
$('#app').onchange=e=>{
  if(e.target.dataset.a==='jour'&&e.target.value){S.jour=e.target.value;render()}
  if(e.target.id==='rf'){
    const f=e.target.files[0];if(!f)return;
    f.text().then(t=>{const j=JSON.parse(t);
      ['creances','paiements','depenses'].forEach(n=>(j[n]||[]).forEach(({id,...d})=>save(n,d,id)));
      alert('Sauvegarde restaurée.')}).catch(()=>alert('Fichier invalide.'));
  }
};
let off=[];
onAuthStateChanged(auth,u=>{
  off.forEach(f=>f());off=[];S.user=u;
  if(u)['creances','paiements','depenses'].forEach(n=>off.push(onSnapshot(colRef(n),s=>{S[n]=s.docs.map(d=>({id:d.id,...d.data()}));render()})));
  render();
});
addEventListener('online',render);addEventListener('offline',render);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
